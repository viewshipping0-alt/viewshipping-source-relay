name: Update ViewShipping relay

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: viewshipping-relay-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.54.0-chromium

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r collector/requirements.txt

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Collect and validate official sources
        run: python collector/collect.py

      - name: Commit changed snapshots
        run: |
          if git diff --quiet -- relay; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "viewshipping-relay-bot"
          git config user.email "viewshipping-relay-bot@users.noreply.github.com"
          git add relay
          git commit -m "Update official-source relay snapshots"
          git push
